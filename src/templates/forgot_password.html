<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | StudyMore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='zine.css') }}">
    {% include "_ui_head.html" %}
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>

<body class="auth-page">

<header class="topbar">
    <span class="brand">StudyMore</span>
</header>

<main class="auth-main">

    <div class="auth-card">

        <div class="auth-heading">
            <h1>Forgot your password?</h1>
            <p>Enter the email you signed up with and we will send you a code to choose a new one.</p>
        </div>

        {% if error %}<div class="message error" role="alert">{{ error }}</div>{% endif %}

        <form method="POST" action="{{ url_for('reset.forgot_password') }}" class="auth-form">
            <label>
                <span>Email <span class="required">*</span></span>
                <input
                    name="email"
                    type="email"
                    placeholder="you@mavs.uta.edu"
                    value="{{ email or '' }}"
                    autofocus
                    required>
            </label>

            <button type="submit" class="primary auth-button">Send me a code</button>
        </form>

        <p class="auth-switch">
            Remembered it? <a href="{{ url_for('login') }}">Back to log in</a>
        </p>

    </div>

</main>

{% include "_ui_foot.html" %}
</body>
</html>
