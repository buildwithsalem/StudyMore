<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Study Group | StudyMore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">
    <span class="brand">StudyMore</span>

    <nav>
        <a href="{{ url_for('search.search') }}">Search Groups</a>
        <a href="{{ url_for('create_group') }}" class="active">Create Group</a>
        <a href="{{ url_for('my_groups') }}">My Groups</a>
        <a href="{{ url_for('logout') }}">Log Out</a>
    </nav>
</header>

<main class="create-main">

    <div class="page-heading">
        <h1>Create a Study Group</h1>
        <p>Add the details students need to find and join your study group.</p>
    </div>
    {% if error %}
    <div class="message error" role="alert">
        {{ error }}
    </div>
{% endif %}

    <form method="POST" class="create-form">

        <div class="form-section">
            <h2>Group Information</h2>

            <label for="group_name">
                <span>Group Name <span class="required">*</span></span>
                <input
                    type="text"
                    id="group_name"
                    name="group_name"
                    placeholder="Example: CSE 3311 Exam Study Group"
                    value="{{ form.get('group_name', '') if form else '' }}"
                    required>
            </label>

            <div class="form-grid">
                <label for="course_code">
                    <span>Course Code <span class="required">*</span></span>
                    <input
                        type="text"
                        id="course_code"
                        name="course_code"
                        placeholder="Example: CSE 3311"
                        value="{{ form.get('course_code', '') if form else '' }}"
                        required>
                </label>

                <label for="section">
                    <span>Section <span class="optional">(optional)</span></span>
                    <input
                        type="text"
                        id="section"
                        name="section"
                        placeholder="Example: 001"
                        value="{{ form.get('section', '') if form else '' }}">
                </label>
            </div>

            <label for="description">
                <span>Description <span class="required">*</span></span>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Describe what your group plans to study."
                    required>{{ form.get('description', '') if form else '' }}</textarea>
            </label>
        </div>


        <div class="form-section">
            <h2>Meeting Details</h2>

            <fieldset class="meeting-options">
                <legend>
                    Meeting Type <span class="required">*</span>
                </legend>

                <label class="radio-option">
                    <input
                        type="radio"
                        id="in_person"
                        name="meeting_type"
                        value="In-Person"
                        {% if form and form.get('meeting_type') == 'In-Person' %}checked{% endif %}
                        required>
                    <span>In-Person</span>
                </label>

                <label class="radio-option">
                    <input
                        type="radio"
                        id="online"
                        name="meeting_type"
                        value="Online"
                        {% if form and form.get('meeting_type') == 'Online' %}checked{% endif %}>
                    <span>Online</span>
                </label>

                <label class="radio-option">
                    <input
                        type="radio"
                        id="hybrid"
                        name="meeting_type"
                        value="Hybrid"
                        {% if form and form.get('meeting_type') == 'Hybrid' %}checked{% endif %}>
                    <span>Hybrid</span>
                </label>
            </fieldset>

            <div class="form-grid">
                <label for="meeting_date">
                    <span>Meeting Date <span class="required">*</span></span>
                    <input
                        type="date"
                        id="meeting_date"
                        name="meeting_date"
                        value="{{ form.get('meeting_date', '') if form else '' }}"
                        required>
                </label>

                <label for="meeting_time">
                    <span>Meeting Time <span class="required">*</span></span>
                    <input
                        type="time"
                        id="meeting_time"
                        name="meeting_time"
                        value="{{ form.get('meeting_time', '') if form else '' }}"
                        required>
                </label>
            </div>

            <div class="form-grid">
                <label for="location">
                    <span>
                        Location
                        <span class="conditional">Required for In-Person & Hybrid</span>
                    </span>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: UTA Central Library"
                        value="{{ form.get('location', '') if form else '' }}">
                </label>

                <label for="meeting_link">
                    <span>
                        Meeting Link
                        <span class="conditional">Required for Online & Hybrid</span>
                    </span>
                    <input
                        type="url"
                        id="meeting_link"
                        name="meeting_link"
                        placeholder="Example: Teams or Zoom link"
                        value="{{ form.get('meeting_link', '') if form else '' }}">
                </label>
            </div>

            <label for="max_members">
                <span>Maximum Members <span class="required">*</span></span>
                <input
                    type="number"
                    id="max_members"
                    name="max_members"
                    min="2"
                    placeholder="Minimum 2"
                    value="{{ form.get('max_members', '') if form else '' }}"
                    required>
            </label>

        </div>

        <p class="required-note">
            <span class="required">*</span> Required fields
        </p>

        <button type="submit" class="primary create-button">
            Create Group
        </button>

    </form>

</main>

</body>
</html>
