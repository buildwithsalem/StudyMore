<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a New Password | StudyMore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='zine.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>

<body class="auth-page">

<header class="topbar">
    <span class="brand">StudyMore</span>
</header>

<main class="auth-main">

    <div class="auth-card">

        <div class="auth-heading">
            <h1>Choose a new password</h1>
            <p>Enter the {{ code_length }}-digit code sent to <strong>{{ masked_email }}</strong>, then pick a new password. The code expires in 10 minutes.</p>
        </div>

        {% if error %}<div class="message error" role="alert">{{ error }}</div>{% endif %}
        {% if info %}<div class="message success" role="status">{{ info }}</div>{% endif %}

        <form method="POST" action="{{ url_for('reset.reset_password') }}" class="auth-form">
            <label>
                <span>Code <span class="required">*</span></span>
                <input
                    name="code"
                    type="text"
                    class="code-input"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="[0-9 ]*"
                    maxlength="{{ code_length + 1 }}"
                    placeholder="123456"
                    autofocus
                    required>
            </label>

            <label>
                <span>New password <span class="required">*</span></span>
                <input
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="{{ min_password }}"
                    placeholder="At least {{ min_password }} characters"
                    required>
            </label>

            <label>
                <span>Confirm new password <span class="required">*</span></span>
                <input
                    name="confirm_password"
                    type="password"
                    autocomplete="new-password"
                    minlength="{{ min_password }}"
                    placeholder="Type it again"
                    required>
            </label>

            <button type="submit" class="primary auth-button">Change password</button>
        </form>

        <form method="POST" action="{{ url_for('reset.reset_resend') }}" class="auth-form resend-form">
            <button type="submit" class="secondary auth-button">Send me a new code</button>
        </form>

        <p class="auth-switch">
            Wrong email? <a href="{{ url_for('reset.forgot_password') }}">Start over</a>
        </p>

    </div>

</main>

</body>
</html>
